<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register – GG Gamestore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Open+Sans:wght@300;400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-bg {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #0a0a0f 0%, #0d0d22 40%, #0a1830 100%);
      position: relative;
      overflow: hidden;
    }
    .auth-bg::before {
      content:'';
      position:absolute;
      inset:0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0,153,255,0.15) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 20%, rgba(255,0,102,0.10) 0%, transparent 50%);
      animation: gradientShift 8s ease infinite;
      background-size: 300% 300%;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo img { height: 52px; margin: 0 auto 10px; filter: drop-shadow(0 0 12px rgba(0,153,255,0.6)); }
    .auth-logo h1 { font-size: 1rem; color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }
    .auth-tabs {
      display: flex;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--card-border);
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-head);
      font-size: 0.72rem;
      cursor: pointer;
      transition: all var(--transition);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: -1px;
    }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .auth-form { display: none; }
    .auth-form.active { display: block; animation: fadeIn 0.3s ease; }
    .alert-box {
      padding: 10px 14px;
      border-radius: var(--radius);
      font-size: 0.83rem;
      margin-bottom: 16px;
      display: none;
    }
    .alert-box.show { display: block; }
    .alert-error  { background: rgba(255,51,51,0.12); border: 1px solid rgba(255,51,51,0.3); color: #ff7777; }
    .alert-success{ background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.3); color: var(--success); }
  </style>
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="../images/gg-logo.svg" alt="GG Gamestore">
      <h1>GG GAMESTORE</h1>
    </div>

    <div class="glass-panel">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="register">Register</button>
      </div>

      <!-- LOGIN FORM -->
      <div class="auth-form active" id="loginForm">
        <div class="alert-box alert-error" id="loginError"></div>
        <div class="alert-box alert-success" id="loginSuccess"></div>

        <div class="form-group">
          <label for="loginUsername"><i class="fas fa-user"></i> Username</label>
          <input type="text" id="loginUsername" class="form-control" placeholder="Enter your username" autocomplete="username">
          <div class="form-error" id="loginUsernameErr">Username is required.</div>
        </div>

        <div class="form-group">
          <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" autocomplete="current-password">
          <div class="form-error" id="loginPasswordErr">Password is required.</div>
        </div>

        <button class="btn btn-cta btn-full mt-8" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i> LOGIN
        </button>

        <p class="text-center mt-16" style="font-size:0.8rem; color:var(--text-muted);">
          Don't have an account?
          <button class="auth-tab" style="font-size:0.8rem; padding:0; color:var(--primary); text-decoration:underline; background:none; border:none; cursor:pointer;" data-tab="register">Register here</button>
        </p>
      </div>

      <!-- REGISTER FORM -->
      <div class="auth-form" id="registerForm">
        <div class="alert-box alert-error" id="registerError"></div>
        <div class="alert-box alert-success" id="registerSuccess"></div>

        <div class="form-group">
          <label for="regUsername"><i class="fas fa-user"></i> Username</label>
          <input type="text" id="regUsername" class="form-control" placeholder="Choose a username" autocomplete="username">
          <div class="form-error" id="regUsernameErr">Username must be at least 3 characters.</div>
        </div>

        <div class="form-group">
          <label for="regEmail"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" autocomplete="email">
          <div class="form-error" id="regEmailErr">Please enter a valid email.</div>
        </div>

        <div class="form-group">
          <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Min 6 characters" autocomplete="new-password">
          <div class="form-error" id="regPasswordErr">Password must be at least 6 characters.</div>
        </div>

        <div class="form-group">
          <label for="regConfirm"><i class="fas fa-lock"></i> Confirm Password</label>
          <input type="password" id="regConfirm" class="form-control" placeholder="Repeat password" autocomplete="new-password">
          <div class="form-error" id="regConfirmErr">Passwords do not match.</div>
        </div>

        <button class="btn btn-cta btn-full mt-8" id="registerBtn">
          <i class="fas fa-user-plus"></i> CREATE ACCOUNT
        </button>

        <p class="text-center mt-16" style="font-size:0.8rem; color:var(--text-muted);">
          Already have an account?
          <button class="auth-tab" style="font-size:0.8rem; padding:0; color:var(--primary); text-decoration:underline; background:none; border:none; cursor:pointer;" data-tab="login">Login here</button>
        </p>
      </div>
    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
<script>
  // If already logged in, redirect
  if (isLoggedIn()) window.location.href = '/index.html';

  // Tab switching
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      if (!target) return;
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('[data-tab="' + target + '"]').forEach(t => t.classList.add('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      document.getElementById(target + 'Form').classList.add('active');
    });
  });

  function showAlert(id, msg, type = 'error') {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `alert-box alert-${type} show`;
  }

  function hideAlerts(...ids) {
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) { el.textContent = ''; el.classList.remove('show'); }
    });
  }

  function setErr(id, show) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('visible', show);
  }

  // LOGIN
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    hideAlerts('loginError', 'loginSuccess');

    let valid = true;
    setErr('loginUsernameErr', !username);
    setErr('loginPasswordErr', !password);
    if (!username || !password) return;

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

    try {
      await login(username, password);
      showAlert('loginSuccess', 'Login successful! Redirecting...', 'success');
      setTimeout(() => window.location.href = '/index.html', 800);
    } catch (err) {
      showAlert('loginError', err.message || 'Login failed. Check your credentials.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> LOGIN';
    }
  });

  document.getElementById('loginPassword').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });

  // REGISTER
  document.getElementById('registerBtn').addEventListener('click', async () => {
    const username = document.getElementById('regUsername').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm  = document.getElementById('regConfirm').value;
    hideAlerts('registerError', 'registerSuccess');

    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    setErr('regUsernameErr', username.length < 3);
    setErr('regEmailErr', !emailValid);
    setErr('regPasswordErr', password.length < 6);
    setErr('regConfirmErr', password !== confirm);
    if (username.length < 3 || !emailValid || password.length < 6 || password !== confirm) return;

    const btn = document.getElementById('registerBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

    try {
      await register(username, email, password);
      showAlert('registerSuccess', 'Account created! Logging you in...', 'success');
      await login(username, password);
      setTimeout(() => window.location.href = '/index.html', 900);
    } catch (err) {
      showAlert('registerError', err.message || 'Registration failed. Try a different username.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-user-plus"></i> CREATE ACCOUNT';
    }
  });
</script>
</body>
</html>
