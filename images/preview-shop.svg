<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none" role="img" aria-label="GG Gamestore – Browse Games page preview">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0a0a0f"/>
      <stop offset="55%"  stop-color="#0d0d22"/>
      <stop offset="100%" stop-color="#0a1830"/>
    </linearGradient>
    <linearGradient id="sidebar-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0e0e22"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#13132b"/>
      <stop offset="100%" stop-color="#0d0d1f"/>
    </linearGradient>
    <linearGradient id="btn2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#006bcc"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" rx="12" fill="url(#bg2)"/>

  <!-- Ambient glow -->
  <ellipse cx="900" cy="360" rx="500" ry="350" fill="#0099ff" fill-opacity="0.04"/>

  <!-- ── NAVBAR ── -->
  <rect width="1280" height="56" fill="rgba(10,10,18,0.95)"/>
  <line x1="0" y1="56" x2="1280" y2="56" stroke="#0099ff" stroke-width="0.8" stroke-opacity="0.35"/>
  <!-- Logo icon (micro) -->
  <polygon points="18,11 60,11 66,17 66,39 60,45 18,45 12,39 12,17"
    fill="rgba(0,10,30,0.85)" stroke="#0099ff" stroke-width="0.9" stroke-opacity="0.6"/>
  <rect x="17" y="18" width="2.5" height="12.5" fill="#0099ff" opacity="0.9"/>
  <rect x="17" y="18" width="10"  height="2.5"  fill="#0099ff" opacity="0.9"/>
  <rect x="22" y="22.5" width="7.5" height="2.5" fill="#0099ff" opacity="0.9"/>
  <rect x="27" y="25"  width="2.5" height="2.5"  fill="#0099ff" opacity="0.9"/>
  <rect x="17" y="28"  width="12.5" height="2.5" fill="#0099ff" opacity="0.9"/>
  <rect x="33" y="18" width="2.5" height="12.5" fill="#00ccff" opacity="0.9"/>
  <rect x="33" y="18" width="10"  height="2.5"  fill="#00ccff" opacity="0.9"/>
  <rect x="38" y="22.5" width="7.5" height="2.5" fill="#00ccff" opacity="0.9"/>
  <rect x="43" y="25"  width="2.5" height="2.5"  fill="#00ccff" opacity="0.9"/>
  <rect x="33" y="28"  width="12.5" height="2.5" fill="#00ccff" opacity="0.9"/>
  <circle cx="39" cy="43" r="1.2" fill="#ff0066" opacity="0.9"/>
  <text x="80"  y="34" font-family="monospace" font-size="14" font-weight="900" letter-spacing="2" fill="#0099ff" opacity="0.95">GG</text>
  <text x="101" y="34" font-family="monospace" font-size="10" font-weight="600" letter-spacing="3" fill="#ffffff" opacity="0.65">GAMESTORE</text>
  <!-- Nav links -->
  <text x="420" y="33" font-family="sans-serif" font-size="12" fill="#ffffff" opacity="0.55">Home</text>
  <text x="490" y="33" font-family="sans-serif" font-size="12" fill="#0099ff" opacity="0.95">Browse Games</text>
  <rect x="487" y="36" width="96" height="1.5" fill="#0099ff" rx="1"/>
  <text x="620" y="33" font-family="sans-serif" font-size="12" fill="#ffffff" opacity="0.55">Cart  2</text>
  <rect x="638" y="20" width="16" height="16" rx="8" fill="#ff0066"/>
  <text x="646" y="32" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#fff">2</text>
  <text x="1100" y="33" font-family="sans-serif" font-size="12" fill="#ffffff" opacity="0.7">👤 playerone</text>
  <text x="1220" y="33" font-family="sans-serif" font-size="12" fill="#667788" opacity="0.7">Logout</text>

  <!-- ── PAGE HEADER ── -->
  <text x="300" y="92" font-family="monospace" font-size="18" font-weight="900" letter-spacing="4" fill="#ffffff" opacity="0.9">ALL GAMES</text>
  <rect x="298" y="98" width="130" height="2" fill="#0099ff" rx="1" opacity="0.7"/>

  <!-- ── SEARCH BAR ── -->
  <rect x="298" y="112" width="740" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="#0099ff" stroke-width="0.9" stroke-opacity="0.4"/>
  <text x="320" y="136" font-family="sans-serif" font-size="12" fill="#445566">Search games by name...</text>
  <rect x="998" y="112" width="42" height="38" rx="6" fill="url(#btn2)" opacity="0.85"/>
  <text x="1019" y="135" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#fff">🔍</text>
