  <circle cx="80"  cy="322" r="6" fill="#0a0a1e" stroke="#0099ff" stroke-width="1.5"/>
  <circle cx="180" cy="322" r="6" fill="#0099ff"/>
  <text x="80"  y="342" font-family="monospace" font-size="9" fill="#667788">0</text>
  <text x="168" y="342" font-family="monospace" font-size="9" fill="#667788">100</text>

