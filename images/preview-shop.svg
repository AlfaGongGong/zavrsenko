  <text x="80" y="378" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.7" letter-spacing="2">PLATFORM</text>
  <rect x="80" y="388" width="54" height="24" rx="4" fill="#0099ff" opacity="0.2" stroke="#0099ff" stroke-width="1"/>
  <text x="107" y="404" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#0099ff">PC</text>
  <rect x="140" y="388" width="54" height="24" rx="4" fill="none" stroke="#445566" stroke-width="1"/>
  <text x="167" y="404" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#667788">PS5</text>
  <rect x="80" y="418" width="54" height="24" rx="4" fill="none" stroke="#445566" stroke-width="1"/>
  <text x="107" y="434" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#667788">Xbox</text>

