  <text x="80" y="132" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff" opacity="0.7" letter-spacing="2">GENRE</text>
  <g font-family="sans-serif" font-size="11" fill="#8899aa">
    <!-- checked: Action -->
    <rect x="80" y="142" width="11" height="11" rx="2" fill="#0099ff" opacity="0.9"/>
    <text x="80" y="140">✓</text>
    <text x="97" y="152">Action</text>
    <!-- unchecked rest -->
    <rect x="80" y="162" width="11" height="11" rx="2" fill="none" stroke="#445566" stroke-width="1"/>
    <text x="97" y="172">RPG</text>
    <rect x="80" y="182" width="11" height="11" rx="2" fill="none" stroke="#445566" stroke-width="1"/>
    <text x="97" y="192">Strategy</text>
    <rect x="80" y="202" width="11" height="11" rx="2" fill="none" stroke="#445566" stroke-width="1"/>
    <text x="97" y="212">Shooter</text>
    <rect x="80" y="222" width="11" height="11" rx="2" fill="none" stroke="#445566" stroke-width="1"/>
    <text x="97" y="232">Horror</text>
    <rect x="80" y="242" width="11" height="11" rx="2" fill="none" stroke="#445566" stroke-width="1"/>
    <text x="97" y="252">Sports</text>
    <rect x="80" y="262" width="11" height="11" rx="2" fill="none" stroke="#445566" stroke-width="1"/>
    <text x="97" y="272">Racing</text>
