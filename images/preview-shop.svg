  <text x="155" y="479" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff0066" opacity="0.8">RESET FILTERS</text>

  <!-- ── GAME CARDS GRID (3×2) ── -->
  <!-- Row 1 -->
  <!-- Card A -->
  <rect x="298" y="164" width="196" height="246" rx="8" fill="url(#card2)" stroke="#0099ff" stroke-width="0.7" stroke-opacity="0.3"/>
  <rect x="298" y="164" width="196" height="118" rx="8" fill="#1a1030" opacity="0.9"/>
  <text x="396" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Cyberpunk Arena</text>
  <text x="396" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#667788">Action / RPG</text>
  <text x="396" y="338" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#00ff88">49.99 KM</text>
  <rect x="316" y="352" width="160" height="28" rx="4" fill="url(#btn2)" opacity="0.85"/>
  <text x="396" y="370" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">ADD TO CART</text>

  <!-- Card B -->
  <rect x="510" y="164" width="196" height="246" rx="8" fill="url(#card2)" stroke="#0099ff" stroke-width="0.7" stroke-opacity="0.3"/>
  <rect x="510" y="164" width="196" height="118" rx="8" fill="#20100a" opacity="0.9"/>
  <text x="608" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Neon Striker</text>
  <text x="608" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#667788">Sports / Arcade</text>
  <text x="608" y="338" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#00ff88">29.99 KM</text>
  <rect x="528" y="352" width="160" height="28" rx="4" fill="url(#btn2)" opacity="0.85"/>
  <text x="608" y="370" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">ADD TO CART</text>

  <!-- Card C — with DEAL badge -->
  <rect x="722" y="164" width="196" height="246" rx="8" fill="url(#card2)" stroke="#ff9900" stroke-width="0.9" stroke-opacity="0.5"/>
  <rect x="722" y="164" width="196" height="118" rx="8" fill="#0d1e10" opacity="0.9"/>
  <rect x="722" y="164" width="60" height="22" rx="4" fill="#ff9900" opacity="0.9"/>
  <text x="752" y="178" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#000">DEAL -40%</text>
  <text x="820" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Dark Protocol</text>
  <text x="820" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#667788">Strategy</text>
  <text x="820" y="335" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff9900">34.99 KM <tspan font-size="8" fill="#ff4466" text-decoration="line-through" dx="4">59.99</tspan></text>
  <rect x="740" y="352" width="160" height="28" rx="4" fill="url(#btn2)" opacity="0.85"/>
  <text x="820" y="370" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">ADD TO CART</text>

  <!-- Card D -->
  <rect x="934" y="164" width="196" height="246" rx="8" fill="url(#card2)" stroke="#0099ff" stroke-width="0.7" stroke-opacity="0.3"/>
  <rect x="934" y="164" width="196" height="118" rx="8" fill="#101628" opacity="0.9"/>
  <text x="1032" y="304" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Voidrunner X</text>
  <text x="1032" y="320" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#667788">Shooter</text>
  <text x="1032" y="338" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#00ff88">54.99 KM</text>
  <rect x="952" y="352" width="160" height="28" rx="4" fill="url(#btn2)" opacity="0.85"/>
  <text x="1032" y="370" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">ADD TO CART</text>

  <!-- Row 2 -->
  <!-- Card E -->
  <rect x="298"  y="426" width="196" height="246" rx="8" fill="url(#card2)" stroke="#0099ff" stroke-width="0.7" stroke-opacity="0.3"/>
  <rect x="298"  y="426" width="196" height="118" rx="8" fill="#1e0e18" opacity="0.9"/>
  <text x="396"  y="566" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Phantom Grid</text>
  <text x="396"  y="582" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#667788">Horror / Puzzle</text>
  <text x="396"  y="600" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ff9900">19.99 KM <tspan font-size="8" fill="#ff4466" text-decoration="line-through" dx="4">39.99</tspan></text>
  <rect x="316"  y="614" width="160" height="28" rx="4" fill="url(#btn2)" opacity="0.85"/>
  <text x="396"  y="632" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">ADD TO CART</text>

  <!-- Card F -->
  <rect x="510" y="426" width="196" height="246" rx="8" fill="url(#card2)" stroke="#0099ff" stroke-width="0.7" stroke-opacity="0.3"/>
  <rect x="510" y="426" width="196" height="118" rx="8" fill="#0e1e0e" opacity="0.9"/>
  <text x="608" y="566" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Orbital Siege</text>
  <text x="608" y="582" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#667788">RTS / Sci-Fi</text>
  <text x="608" y="600" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#00ff88">44.99 KM</text>
  <rect x="528" y="614" width="160" height="28" rx="4" fill="url(#btn2)" opacity="0.85"/>
  <text x="608" y="632" text-anchor="middle" font-family="monospace" font-size="9" fill="#fff">ADD TO CART</text>

  <!-- Pagination -->
  <g transform="translate(720, 440)">
    <rect width="36" height="36" rx="4" fill="rgba(0,153,255,0.15)" stroke="#0099ff" stroke-width="1"/>
    <text x="18" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#0099ff">1</text>
    <rect x="44" width="36" height="36" rx="4" fill="none" stroke="#334455" stroke-width="1"/>
    <text x="62" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#667788">2</text>
    <rect x="88" width="36" height="36" rx="4" fill="none" stroke="#334455" stroke-width="1"/>
    <text x="106" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#667788">3</text>
    <rect x="132" width="36" height="36" rx="4" fill="none" stroke="#334455" stroke-width="1"/>
    <text x="150" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#667788">›</text>
  </g>

  <!-- Bottom fade -->
  <defs>
    <linearGradient id="fade2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect y="620" width="1280" height="100" fill="url(#fade2)"/>

  <!-- Screen border -->
  <rect width="1280" height="720" rx="12" fill="none" stroke="#0099ff" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
